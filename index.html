<!DOCTYPE html>
<html lang="it" class="app-boot">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html.app-boot,
      html.app-boot body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        background-color: #020617;
      }
      html.app-boot #root {
        position: relative;
        z-index: 0;
        min-height: 100%;
        height: 100%;
      }
      #app-boot-static {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #020617;
        opacity: 1;
        pointer-events: none;
      }
      #app-boot-static .app-boot-splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        max-width: 92vw;
      }
      #app-boot-static .app-boot-splash-art {
        width: min(960px, 86vw);
        height: min(540px, 78vh);
        max-width: 100%;
        max-height: 72vh;
        aspect-ratio: 16 / 9;
        flex-shrink: 0;
        background-image: url(__INLINE_SPLASH_URI__);
        background-size: contain;
        background-position: center top;
        background-repeat: no-repeat;
      }
      #app-boot-static .app-boot-splash-loading {
        width: min(520px, 72vw);
        text-align: center;
      }
      #app-boot-static .app-boot-splash-label {
        margin: 0 0 0.5rem;
        font: 500 0.95rem "DM Sans", system-ui, sans-serif;
        color: #94a3b8;
        letter-spacing: 0.02em;
      }
      #app-boot-static .app-boot-splash-bar {
        height: 7px;
        border-radius: 9999px;
        background: rgba(59, 130, 246, 0.22);
        overflow: hidden;
        box-shadow: 0 0 12px rgba(59, 130, 246, 0.15);
      }
      #app-boot-static .app-boot-splash-bar-fill {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2563eb, #60a5fa);
        transition: width 0.35s ease-out;
      }
    </style>
    <title>HelpDesk Manager</title>
  </head>
  <body class="antialiased">
    <script>
      (function () {
        if ((location.hash || "").indexOf("detached=1") === -1) return;
        document.documentElement.classList.remove("app-boot");
        document.getElementById("app-boot-static")?.remove();
      })();
    </script>
    <div id="root"></div>
    <div id="app-boot-static" aria-hidden="true">
      <div class="app-boot-splash-card">
        <div class="app-boot-splash-art"></div>
        <div class="app-boot-splash-loading">
          <p class="app-boot-splash-label">Caricamento in corso…</p>
          <div class="app-boot-splash-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span class="app-boot-splash-bar-fill" id="app-boot-splash-progress"></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module">
      void (async () => {
        if (!window.__TAURI_INTERNALS__?.invoke) return;
        const { getCurrentWindow } = await import("@tauri-apps/api/window");
        await getCurrentWindow().show();
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
